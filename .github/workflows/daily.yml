name: Daily knowledge sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: knowledge-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VECTOR_STORE_ID: ${{ secrets.VECTOR_STORE_ID }}
      MAX_ARTICLES: "35"
      MUST_INCLUDE_KEYWORDS: "youtube"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore sync state
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            data
          key: signguide-state-${{ github.run_id }}
          restore-keys: |
            signguide-state-

      - name: Prepare runtime directories
        shell: bash
        run: |
          mkdir -p state data artifacts
          chmod -R a+rwx state data artifacts

      - name: Build image
        run: docker build --tag signguide-ai:ci .

      - name: Run sync
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env OPENAI_API_KEY \
            --env VECTOR_STORE_ID \
            --env MAX_ARTICLES \
            --env MUST_INCLUDE_KEYWORDS \
            --volume "$GITHUB_WORKSPACE/state:/app/state" \
            --volume "$GITHUB_WORKSPACE/data:/app/data" \
            signguide-ai:ci 2>&1 | tee artifacts/last-run.log

      - name: Save sync state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            data
          key: signguide-state-${{ github.run_id }}

      - name: Write last-run summary
        if: always()
        shell: bash
        run: |
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E "Discovered:|VectorStore:|FileCounts:" artifacts/last-run.log || true
          } > artifacts/last-run-summary.txt

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signguide-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
